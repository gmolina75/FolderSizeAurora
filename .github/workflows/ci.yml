name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore foldersizeaurora/FolderSizeAurora.csproj

      - name: Build
        run: dotnet build foldersizeaurora/FolderSizeAurora.csproj --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Publish (self-contained, win-x64)
        run: dotnet publish foldersizeaurora/FolderSizeAurora.csproj --configuration ${{ env.CONFIGURATION }} --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ${{ runner.temp }}/publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderSizeAurora-${{ env.CONFIGURATION }}-win-x64
          path: ${{ runner.temp }}/publish/**

  build-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: FolderSizeAurora-${{ env.CONFIGURATION }}-win-x64
          path: landing

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Build MSI
        run: |
          wix build FolderSizeAurora.wxs -o landing/FolderSizeAurora.msi
        env:
          PATH: ${{ env.PATH }};C:\Users\runneradmin\.dotnet\tools

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderSizeAurora-Installer
          path: landing/FolderSizeAurora.msi

  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore foldersizeaurora/FolderSizeAurora.csproj

      - name: Test
        run: dotnet test foldersizeaurora.Tests/FolderSizeAurora.Tests.csproj --configuration ${{ env.CONFIGURATION }} --no-restore

  release:
    needs: [build, build-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: FolderSizeAurora-${{ env.CONFIGURATION }}-win-x64
          path: release-files

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: FolderSizeAurora-Installer
          path: release-files

      - name: Create ZIP
        run: |
          cd release-files
          7z a -tzip "FolderSizeAurora-${{ github.ref_name }}-win-x64.zip" FolderSizeAurora.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/FolderSizeAurora.msi
            release-files/FolderSizeAurora-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false